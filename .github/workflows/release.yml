# Releases: pushing a tag `vX.Y.Z` (from a main that passed CI) builds the desktop installers
# on Windows, macOS (Apple Silicon and Intel) and Linux, plus the `spelaiondb` CLI with the MCP
# server, and publishes them as the latest GitHub release. Its notes are `docs/releases/vX.Y.Z.md`
# followed by every commit since the previous tag (`scripts/release-notes.sh`). The app's
# update artifacts (`.sig` files and `latest.json`) are signed with the repository secret
# `TAURI_SIGNING_PRIVATE_KEY` (ADR-021).
#
# Versions: actions are pinned to a commit (the comment names the release) and Rust to a
# version, the same ones as `ci.yml`, so a release is built with what CI tested: bump both
# together.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  create:
    name: Draft release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history and the tags: the notes list the commits since the last release.
          fetch-depth: 0
      # The tag, the app and the crates must agree on the version.
      - run: |
          app=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          crates=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$app" = "$GITHUB_REF_NAME" -a "$app" = "$crates" || {
            echo "tag $GITHUB_REF_NAME, app $app and crates $crates must match"; exit 1; }
          test -f "docs/releases/$GITHUB_REF_NAME.md" || {
            echo "missing docs/releases/$GITHUB_REF_NAME.md"; exit 1; }
      - run: |
          scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "SpelaionDB ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  app:
    name: App · ${{ matrix.name }}
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
          - name: macOS Apple Silicon
            platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: macOS Intel
            platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - name: Linux
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      # Read only: each release is a new tag, so a cache saved here would never be used again
      # and would only push CI's useful caches out of the 10 GB GitHub keeps.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      # libduckdb-sys reuses its unpacked sources in target/duckdb-sources only when its
      # `.complete` marker is there, and rust-cache's cleanup leaves that folder's tree without
      # its files, so a rerun of its build script could not unpack (see ci.yml's Linux job).
      - shell: bash
        run: rm -rf target/duckdb-sources
      # WebKitGTK and friends for the app; libdbus for the keychain (Secret Service).
      - if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libdbus-1-dev pkg-config libssl-dev libxdo-dev
      - run: npm ci
        working-directory: apps/desktop
      # The `spelaiondb` CLI ships inside the app, next to its binary (ADR-033), so the MCP page
      # can set up AI clients on a machine with nothing else installed. Tauri's `externalBin`
      # (only in tauri.release.conf.json) wants it as binaries/spelaiondb-<target triple>.
      #
      # The app and the CLI are built by one cargo command: the same `tauri build` (same
      # `--target`, same `-p` list) as tauri-action's below, so that one finds everything built
      # but the app's own crate, which it builds again with the release config. Built apart,
      # bundled DuckDB is compiled twice: cargo turns on the features of build dependencies
      # from the packages of one command only, and the app's (Tauri's) turn on more of them
      # than the CLI's, so libduckdb-sys gets a different hash in each command (CONTRIBUTING.md,
      # "Release build"). Keep both `-p` lists the same, or every dependency whose features
      # differ is built twice. This one runs without the release config, so it needs no CLI yet.
      - name: Build the app and the CLI that ships with it
        shell: bash
        working-directory: apps/desktop
        run: |
          npm run tauri build -- --no-bundle ${{ matrix.args }} -- --locked -p spelaion-desktop -p spelaion-cli
          ext=""
          if [ "$RUNNER_OS" = "Windows" ]; then ext=".exe"; fi
          out="../../target/release"
          if [ -n "${{ matrix.args }}" ]; then out="../../target/${{ matrix.target }}/release"; fi
          mkdir -p src-tauri/binaries
          cp "$out/spelaiondb$ext" "src-tauri/binaries/spelaiondb-${{ matrix.target }}$ext"
          # The engines that are plugins ship inside the installer too, next to the app
          # (ADR-042): the builds plugins.toml pins for this target, downloaded and let in only
          # with the pinned hashes. The app starts one only while its file has the pinned hash.
          # tauri.release.conf.json names each of them (a test of spelaion-plugin-fetch checks
          # that list against the pins).
          cargo run -q --locked -p spelaion-plugin-fetch -- \
            --platform "${{ matrix.target }}" --into "$RUNNER_TEMP/plugins" > /dev/null
          for program in "$RUNNER_TEMP"/plugins/spelaiondb-plugin-*; do
            name=$(basename "$program" "$ext")
            cp "$program" "src-tauri/binaries/$name-${{ matrix.target }}$ext"
          done
          ls -l src-tauri/binaries
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # The key has no password (ADR-021).
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseDraft: true
          # Not a pre-release: the app's updater follows /releases/latest, which skips them
          # (ADR-021).
          prerelease: false
          # Update artifacts only here: local builds need no signing key. After `--`: the same
          # packages as the build step above, so the CLI's features match and nothing but the
          # app's crate is built again.
          args: --config src-tauri/tauri.release.conf.json ${{ matrix.args }} -- --locked -p spelaion-desktop -p spelaion-cli

  cli:
    name: CLI · ${{ matrix.target }}
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: cli-${{ matrix.target }}
          save-if: false
      # The DuckDB sources folder rust-cache leaves behind (see the app job).
      - shell: bash
        run: rm -rf target/duckdb-sources
      - if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo build --release --locked -p spelaion-cli --target ${{ matrix.target }}
      - name: Package and upload
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          name="spelaiondb-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$name"
          cp LICENSE "$name/"
          # The engines that are plugins ship with the CLI too, next to it (ADR-042): without
          # them `spelaiondb mcp` from this archive would have SQLite and nothing else. The
          # builds plugins.toml pins for this target, let in only with the pinned hashes.
          cargo run -q --locked -p spelaion-plugin-fetch -- \
            --platform "${{ matrix.target }}" --into "$name" > /dev/null
          ls -l "$name"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "target/${{ matrix.target }}/release/spelaiondb.exe" "$name/"
            7z a "$name.zip" "$name" > /dev/null
            archive="$name.zip"
          else
            cp "target/${{ matrix.target }}/release/spelaiondb" "$name/"
            tar czf "$name.tar.gz" "$name"
            archive="$name.tar.gz"
          fi
          gh release upload "$GITHUB_REF_NAME" "$archive" --clobber

  publish:
    name: Publish
    needs: [app, cli]
    runs-on: ubuntu-latest
    steps:
      - run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
