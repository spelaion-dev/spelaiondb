# The Linux smoke test (apps/desktop/e2e/smoke-linux.mjs) against a release build of the real
# app on WebKitGTK: start, repository trust, a query on SQLite, DuckDB, PostgreSQL, MySQL,
# MariaDB and SQL Server (testing/docker), the real X11 clipboard both ways (xclip), an SSH
# tunnel through the two bastions, and quitting with a transaction open (the window manager's
# close request, through wmctrl). It runs under Xvfb with Openbox, a small window manager that
# honours _NET_CLOSE_WINDOW. When a step fails, the job's error names it and the screenshots
# and the log are uploaded as the artifact `smoke-linux`.
#
# When it runs: on every push to `dev` (not `main`: what reaches `main` went through `dev`),
# and on pull requests that change this file or the e2e scripts, so a change to the test is
# seen to pass before it is merged. Other pull requests do not run it: a release build takes
# about half an hour, and the push to `dev` after the merge does. It can also be started by
# hand on any branch (Actions, "Run workflow"). It is not a required check.
#
# Versions: the same pins as ci.yml (actions to a commit, Rust to a version): bump them together.
name: Linux smoke test

on:
  push:
    branches: [dev]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    paths:
      - ".github/workflows/smoke-linux.yml"
      - "apps/desktop/e2e/smoke-linux.mjs"
      - "apps/desktop/e2e/webdriver.mjs"
      - "apps/desktop/e2e/processes.mjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-linux-${{ github.ref }}
  cancel-in-progress: true

# rust-cache makes every variable that starts with CARGO, RUST or CC part of its key.
env:
  CARGO_TERM_COLOR: always

jobs:
  smoke:
    name: Linux · smoke test of the app (WebKitGTK, X11)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A release build of the app with Tauri and bundled DuckDB, and the Docker images, need
      # the space of the tools the runner ships and this job never uses.
      - name: Free disk space in the background
        run: sudo nohup rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL > /dev/null 2>&1 &
      # WebKitGTK and friends to build the app; WebKitWebDriver for tauri-driver (the package
      # is webkitgtk-webdriver from Ubuntu 26.04 on, webkit2gtk-driver before); Xvfb, Openbox,
      # wmctrl and xclip for the X11 session the test runs in.
      - name: Install the system packages in the background
        run: |
          (
            status=failed
            if sudo apt-get update \
              && sudo apt-get install -y libdbus-1-dev pkg-config libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
                webkitgtk-webdriver xvfb openbox wmctrl xclip x11-utils imagemagick
            then
              status=ready
            fi
            echo "$status" > "$RUNNER_TEMP/apt.status"
          ) > "$RUNNER_TEMP/apt.log" 2>&1 &
      # The database servers and the bastions, as in ci.yml's Linux job (no Kubernetes here).
      - name: Start the test services in the background
        run: |
          bash testing/docker/gen-keys.sh
          (
            status=failed
            if docker compose -f testing/docker/compose.yaml up -d --build --wait; then
              status=ready
            fi
            echo "$status" > "$RUNNER_TEMP/services.status"
          ) > "$RUNNER_TEMP/services.log" 2>&1 &
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: 1.99.1
      # Its own cache (the release profile shares nothing with ci.yml's builds), saved only by
      # pushes to `dev`, like ci.yml's. It keeps tauri-driver too (~/.cargo/bin).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: true
          cache-on-failure: true
      # Does nothing when the cache already has this version.
      - run: cargo install tauri-driver --locked --version 2.1.0
      - run: npm ci
        working-directory: apps/desktop
      - name: Wait for the system packages
        run: |
          timeout 600 bash -c 'until [ -f "$RUNNER_TEMP/apt.status" ]; do sleep 1; done' || true
          echo "::group::apt-get output"
          cat "$RUNNER_TEMP/apt.log"
          echo "::endgroup::"
          test "$(cat "$RUNNER_TEMP/apt.status" 2> /dev/null)" = ready
      # The app and the CLI in one command, so bundled DuckDB is compiled once (CONTRIBUTING.md).
      - name: Build the release app and CLI
        run: npx tauri build --no-bundle -- -p spelaion-desktop -p spelaion-cli
        working-directory: apps/desktop
      - run: python3 examples/demo/make-shop-db.py
      - name: Wait for the test services
        run: |
          timeout 600 bash -c 'until [ -f "$RUNNER_TEMP/services.status" ]; do sleep 1; done' || true
          echo "::group::docker compose output"
          cat "$RUNNER_TEMP/services.log"
          echo "::endgroup::"
          test "$(cat "$RUNNER_TEMP/services.status" 2> /dev/null)" = ready
      # An X server with a window manager (wmctrl asks it to close the window, as its close
      # button would); no Wayland, so the test takes its X11 paths (xclip, wmctrl).
      - name: Run the smoke test under Xvfb and Openbox
        working-directory: apps/desktop
        run: |
          unset WAYLAND_DISPLAY
          export DISPLAY=:99
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp > "$RUNNER_TEMP/xvfb.log" 2>&1 &
          timeout 30 bash -c 'until [ -S /tmp/.X11-unix/X99 ]; do sleep 0.2; done'
          openbox > "$RUNNER_TEMP/openbox.log" 2>&1 &
          timeout 30 bash -c 'until wmctrl -m > /dev/null 2>&1; do sleep 0.2; done'
          wmctrl -m
          set -o pipefail
          export SMOKE_DEBUG_CLIPBOARD=1
          export SMOKE_XCLIP_TARGET='text/plain;charset=utf-8'
          if ! node e2e/smoke-linux.mjs 2>&1 | tee "$RUNNER_TEMP/smoke-linux.log"; then
            step=$(sed -n 's/^FAILED at step "\(.*\)":.*/\1/p' "$RUNNER_TEMP/smoke-linux.log" | head -1)
            echo "::error title=Linux smoke test failed::${step:-see the log}"
            echo "Linux smoke test failed at: ${step:-see the log}. Screenshots and log: artifact smoke-linux." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Upload the screenshots and the log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-linux
          path: |
            apps/desktop/e2e/screenshots/linux/
            ${{ runner.temp }}/smoke-linux.log
            ${{ runner.temp }}/xvfb.log
            ${{ runner.temp }}/openbox.log
            ${{ runner.temp }}/services.log
          if-no-files-found: ignore
          retention-days: 14
