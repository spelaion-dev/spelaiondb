# CI is the code reviewer (ADR-012): nothing gets into main without passing through here.
# Work branches (`dev`) do not run it on push: a pull request to main does, and it can be
# started by hand on any branch ("Run workflow").
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # No debug info in CI builds: the target directory of a whole-workspace build with tests
  # otherwise fills the runner's disk.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  linux:
    name: Linux · fmt, clippy, tests with PostgreSQL (TLS), SQLite and SSH tunnels
    runs-on: ubuntu-latest
    env:
      SPELUNK_TEST_PG: 127.0.0.1:15432
      SPELUNK_TEST_MYSQL: 127.0.0.1:13306
      SPELUNK_TEST_MARIADB: 127.0.0.1:13307
      SPELUNK_TEST_SSH: 127.0.0.1:2221
      SPELUNK_TEST_SSH_AGENT: "1"
    steps:
      # The runner ships tools this build never uses; their space is needed (Docker images,
      # a Rust target directory with Tauri and every driver).
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # libdbus: Linux keychain (Secret Service). WebKitGTK and friends: the Tauri app.
      - run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      # The same environment as locally: PostgreSQL with TLS and test certificates.
      - run: bash testing/docker/gen-keys.sh
      - run: docker compose -f testing/docker/compose.yaml up -d --build --wait
      # A real SSH agent with the test key, for the agent authentication test.
      - run: |
          ssh-agent -a /tmp/ssh-agent.sock > /dev/null
          echo "SSH_AUTH_SOCK=/tmp/ssh-agent.sock" >> "$GITHUB_ENV"
          SSH_AUTH_SOCK=/tmp/ssh-agent.sock ssh-add testing/docker/keys/id_ed25519
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # The app's TS types are generated from Rust: the file in the repo must be up to date.
      - run: cargo run -q -p spelunk-desktop --features bindings --bin export-bindings
      - run: git diff --exit-code apps/desktop/src/bindings.ts

  frontend:
    name: App · strict TypeScript and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run build

  windows:
    # Windows runners do not run Linux containers: there is no PostgreSQL here and its
    # tests are skipped (ADR-012). The SQLite ones do run.
    name: Windows · clippy and tests (SQLite)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  kubernetes:
    # Kubernetes connections (ADR-015) against a real cluster: kind in Docker, a PostgreSQL inside.
    name: Kubernetes (kind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: kubernetes
      - run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: helm/kind-action@v1
        with:
          cluster_name: spelunk-test
      - run: kubectl apply -f testing/k8s/postgres.yaml
      - run: kubectl -n spelunk-test rollout status deployment/postgres --timeout=180s
      - run: cargo test -p spelunk-core --test kube
        env:
          SPELUNK_TEST_K8S: /home/runner/.kube/config

  deny:
    name: Licenses and vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
