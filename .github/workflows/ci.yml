# CI is the code reviewer (ADR-012): nothing gets into main without passing through here.
# It runs on every push to `dev` and `main` and on every pull request (the repository is
# public, so Actions minutes are free), and it can be started by hand on any branch. A push that
# only touches documentation does not run it; a pull request always does, because its four jobs
# are required to merge (branch protection) and a pull request without them would wait forever.
# The job names are those required checks: renaming one means changing the branch protection.
#
# A pull request that changes nothing the Rust checks read (only documentation, or only the
# frontend: `needs-rust.sh` has the list) still starts the two Rust jobs, and they pass at once
# without running anything: there is nothing for them to find, and the push to `dev` after the
# merge runs them whole. Every step of those jobs after "Does this change need the Rust
# checks?" carries its condition; a new step needs it too.
#
# Speed: the Rust caches are saved only by pushes to `dev` and `main` (pull requests read
# them): GitHub keeps 10 GB per repository, and one copy per pull request and release pushed
# the useful ones out, so runs started from scratch (30 minutes instead of 12). On Linux,
# what does not need the compiler (freeing disk, the system libraries, the Docker services,
# the Kubernetes cluster) runs in the background while the Rust toolchain and cache are set
# up and Rust compiles; the steps that need them wait for them.
#
# Versions: actions are pinned to a commit (the comment names the release), and Rust to a
# version, so a run only changes when this file does. `release.yml` pins the same ones: bump
# both together.
name: CI

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request replaces a run still going; on `main`
# every run finishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Careful with new variables here: rust-cache makes every one that starts with CARGO, RUST
# or CC part of its key, so adding one starts the caches from scratch.
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # No debug info in CI builds: the target directory of a whole-workspace build with tests
  # otherwise fills the runner's disk.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  linux:
    name: Linux · fmt, clippy, tests with PostgreSQL (TLS), MySQL, SQL Server, SQLite, DuckDB, SSH tunnels and Kubernetes
    runs-on: ubuntu-latest
    # A run from scratch takes about 30 minutes; a hung test must not hold the runner for
    # GitHub's default of six hours.
    timeout-minutes: 60
    env:
      SPELAION_TEST_PG: 127.0.0.1:15432
      SPELAION_TEST_MYSQL: 127.0.0.1:13306
      SPELAION_TEST_MARIADB: 127.0.0.1:13307
      SPELAION_TEST_MSSQL: 127.0.0.1:11433
      SPELAION_TEST_SSH: 127.0.0.1:2221
      SPELAION_TEST_SSH_AGENT: "1"
      # The test proxies (ADR-027) from testing/docker/proxy.
      SPELAION_TEST_SOCKS: 127.0.0.1:11080
      SPELAION_TEST_HTTP_PROXY: 127.0.0.1:13128
      # Kubernetes connections (ADR-015) against kind, in this job so they reuse its build.
      SPELAION_TEST_K8S: /home/runner/.kube/config
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit and its parents: enough to list what a pull request changes.
          fetch-depth: 2
      # On a pull request that changes nothing the Rust checks read, every step below is
      # skipped and the job passes (see the top of this file). Anything but an explicit
      # `false` runs them, and a failure here fails the job: never skipped by accident.
      - name: Does this change need the Rust checks?
        id: scope
        shell: bash
        run: |
          rust=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            rust=$(git diff --no-renames --name-only HEAD^1 HEAD | bash .github/workflows/needs-rust.sh)
          fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          if [ "$rust" = false ]; then
            message="This pull request changes nothing the Rust checks read (see .github/workflows/needs-rust.sh): they were not run here. The push to dev after the merge runs them."
            echo "::notice::$message"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
          fi
      # The runner ships tools this build never uses; their space is needed (Docker images,
      # a Rust target directory with Tauri and every driver). Deleting them takes a minute and
      # a half and nothing waits for it: the disk only fills up later, as the build goes.
      - name: Free disk space in the background
        if: steps.scope.outputs.rust != 'false'
        run: sudo nohup rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL > /dev/null 2>&1 &
      # libdbus: Linux keychain (Secret Service). WebKitGTK and friends: the Tauri app. Installing
      # them takes half a minute that setting up Rust and its cache needs anyway, so it runs in
      # the background: "Wait for the system libraries" below, before the first step that
      # builds, shows its output and fails the job if it failed.
      - name: Install the system libraries in the background
        if: steps.scope.outputs.rust != 'false'
        run: |
          (
            status=failed
            if sudo apt-get update \
              && sudo apt-get install -y libdbus-1-dev pkg-config libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
            then
              status=ready
            fi
            echo "$status" > "$RUNNER_TEMP/apt.status"
          ) > "$RUNNER_TEMP/apt.log" 2>&1 &
      # Only installs kind and kubectl: the cluster is created below, in the background. Its
      # name is given so the action deletes it when the job ends.
      - if: steps.scope.outputs.rust != 'false'
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: spelaion-test
          install_only: true
      # The same environment as locally: PostgreSQL with TLS and test certificates, behind the
      # bastions; then a Kubernetes cluster in Docker (kind) with a PostgreSQL inside. Pulling
      # the images and waiting for the servers takes a minute and a half that Rust needs anyway
      # to compile, so it happens in the background: "Wait for the test services" below shows
      # its output and fails the job if anything here did.
      - name: Start the test services in the background
        if: steps.scope.outputs.rust != 'false'
        run: |
          bash testing/docker/gen-keys.sh
          (
            status=failed
            if docker compose -f testing/docker/compose.yaml up -d --build --wait \
              && kind create cluster --name spelaion-test --wait 60s \
              && kubectl apply -f testing/k8s/postgres.yaml \
              && kubectl -n spelaion-test rollout status deployment/postgres --timeout=180s
            then
              status=ready
            fi
            echo "$status" > "$RUNNER_TEMP/services.status"
          ) > "$RUNNER_TEMP/services.log" 2>&1 &
      - if: steps.scope.outputs.rust != 'false'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      # Careful with `workspaces` and other inputs that change which directories are cached:
      # a cache only matches a run that asks for the same directories, so every run starts
      # from scratch until a push to `dev` saves a new one.
      - if: steps.scope.outputs.rust != 'false'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'push' }}
      # A real SSH agent with the test key, for the agent authentication test.
      - if: steps.scope.outputs.rust != 'false'
        run: |
          ssh-agent -a /tmp/ssh-agent.sock > /dev/null
          echo "SSH_AUTH_SOCK=/tmp/ssh-agent.sock" >> "$GITHUB_ENV"
          SSH_AUTH_SOCK=/tmp/ssh-agent.sock ssh-add testing/docker/keys/id_ed25519
      - if: steps.scope.outputs.rust != 'false'
        run: cargo fmt --all --check
      - name: Wait for the system libraries
        if: steps.scope.outputs.rust != 'false'
        run: |
          timeout 600 bash -c 'until [ -f "$RUNNER_TEMP/apt.status" ]; do sleep 1; done' || true
          echo "::group::apt-get output"
          cat "$RUNNER_TEMP/apt.log"
          echo "::endgroup::"
          test "$(cat "$RUNNER_TEMP/apt.status" 2> /dev/null)" = ready
      - if: steps.scope.outputs.rust != 'false'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Build the tests first: the services are only needed to run them.
      - if: steps.scope.outputs.rust != 'false'
        run: cargo test --workspace --locked --no-run
      # The engines that are plugins (ADR-042): this repository never compiles one. The builds
      # plugins.toml pins are downloaded and let in only with the pinned hashes, and the
      # tests run through them. With nothing pinned this fetches nothing.
      - name: Fetch the pinned plugins
        if: steps.scope.outputs.rust != 'false'
        run: cargo run -q --locked -p spelaion-plugin-fetch -- --into target/plugins >> "$GITHUB_ENV"
      - name: Wait for the test services
        if: steps.scope.outputs.rust != 'false'
        run: |
          timeout 600 bash -c 'until [ -f "$RUNNER_TEMP/services.status" ]; do sleep 1; done' || true
          cat "$RUNNER_TEMP/services.log"
          test "$(cat "$RUNNER_TEMP/services.status" 2> /dev/null)" = ready
      - if: steps.scope.outputs.rust != 'false'
        run: cargo test --workspace --locked
      # The app's TS types are generated from Rust: the file in the repo must be up to date.
      - if: steps.scope.outputs.rust != 'false'
        run: cargo run -q --locked -p spelaion-desktop --features bindings --bin export-bindings
      - if: steps.scope.outputs.rust != 'false'
        run: git diff --exit-code apps/desktop/src/bindings.ts

  frontend:
    name: App · strict TypeScript and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run build

  windows:
    # Windows runners do not run Linux containers: there is no PostgreSQL here and its
    # tests are skipped (ADR-012). The SQLite and DuckDB ones do run.
    name: Windows · clippy and tests (SQLite, DuckDB)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit and its parents: enough to list what a pull request changes.
          fetch-depth: 2
      # On a pull request that changes nothing the Rust checks read, every step below is
      # skipped and the job passes (see the top of this file). Anything but an explicit
      # `false` runs them, and a failure here fails the job: never skipped by accident.
      - name: Does this change need the Rust checks?
        id: scope
        shell: bash
        run: |
          rust=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            rust=$(git diff --no-renames --name-only HEAD^1 HEAD | bash .github/workflows/needs-rust.sh)
          fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          if [ "$rust" = false ]; then
            message="This pull request changes nothing the Rust checks read (see .github/workflows/needs-rust.sh): they were not run here. The push to dev after the merge runs them."
            echo "::notice::$message"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
          fi
      - if: steps.scope.outputs.rust != 'false'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: 1.99.1
          components: clippy
      - if: steps.scope.outputs.rust != 'false'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'push' }}
      - if: steps.scope.outputs.rust != 'false'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The engines that are plugins (ADR-042): this repository never compiles one. The builds
      # plugins.toml pins are downloaded and let in only with the pinned hashes, and the
      # tests run through them. With nothing pinned this fetches nothing.
      - name: Fetch the pinned plugins
        if: steps.scope.outputs.rust != 'false'
        shell: bash
        run: cargo run -q --locked -p spelaion-plugin-fetch -- --into target/plugins >> "$GITHUB_ENV"
      - if: steps.scope.outputs.rust != 'false'
        run: cargo test --workspace --locked

  deny:
    name: Licenses and vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
