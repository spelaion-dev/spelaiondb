name: Idea or feature request
description: Something SpelaionDB could do, or do better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The problem or the workflow, more than the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it could work
      description: Optional. How you imagine it, or how another tool does it.
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Databases, operating system, team setup… whatever helps to understand it.
