#:schema https://spelaion.dev/schema/db/connection.schema.json

# PostgreSQL from testing/docker, direct. The password (spelaion) is asked when connecting.
schema_version = 1
name = "Postgres (Docker)"
engine = "postgres"
env = "dev"
host = "127.0.0.1"
port = 15432
database = "spelaion"
user = "spelaion"
password = { secret = "prompt" }

[tls]
mode = "require"
