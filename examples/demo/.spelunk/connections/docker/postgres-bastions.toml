#:schema https://raw.githubusercontent.com/spelunkdb/spelunkdb/main/schema/connection.schema.json

# The same PostgreSQL, but behind two SSH bastions and with TLS verify-full against its
# real name ("postgres"), as on a company network.
schema_version = 1
name = "Postgres behind bastions"
engine = "postgres"
env = "prod"
host = "postgres"
database = "spelunk"
user = "spelunk"
password = { secret = "keychain" }
tunnel = "docker-bastions"

[tls]
mode = "verify-full"
ca = "../../testing/docker/keys/ca.crt"
