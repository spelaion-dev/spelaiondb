[workspace]
resolver = "3"
members = ["crates/*", "apps/cli", "apps/desktop/src-tauri"]
exclude = ["vendor"]

[workspace.package]
version = "0.9.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/spelaion-dev/spelaiondb"
publish = false

[workspace.dependencies]
spelaion-driver-api = { path = "crates/spelaion-driver-api" }
spelaion-dialect = { path = "crates/spelaion-dialect" }
spelaion-driver-postgres = { path = "crates/spelaion-driver-postgres" }
spelaion-driver-sqlite = { path = "crates/spelaion-driver-sqlite" }
spelaion-driver-mysql = { path = "crates/spelaion-driver-mysql" }
spelaion-driver-duckdb = { path = "crates/spelaion-driver-duckdb" }
spelaion-driver-sqlserver = { path = "crates/spelaion-driver-sqlserver" }
spelaion-core = { path = "crates/spelaion-core" }
spelaion-config = { path = "crates/spelaion-config" }
spelaion-ssh = { path = "crates/spelaion-ssh" }
spelaion-store = { path = "crates/spelaion-store" }
spelaion-mcp = { path = "crates/spelaion-mcp" }

anyhow = "1"
arrow = { version = "60", default-features = false, features = ["ipc"] }
async-trait = "0.1"
futures-util = "0.3"
insta = "1"
postgres-protocol = "0.6"
postgres-types = "0.2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-postgres = "0.7"

[workspace.lints.rust]
unsafe_code = "forbid"

# Debug and test builds keep only what a backtrace needs (function names, files and lines),
# and none for dependencies. With full debug information every test executable carries a PDB
# of up to 1 GB on Windows, and one `cargo test --workspace` fills tens of gigabytes. A
# debugger that needs variables: `CARGO_PROFILE_DEV_DEBUG=2 cargo build`.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# tiberius with a fix to cancelling (see vendor/tiberius/PATCHED.md).
[patch.crates-io]
tokio-postgres = { path = "vendor/tokio-postgres" }
tiberius = { path = "vendor/tiberius" }
mysql_async = { path = "vendor/mysql_async" }
