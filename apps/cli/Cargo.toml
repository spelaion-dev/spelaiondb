[package]
name = "spelunk-cli"
description = "SpelunkDB CLI: MCP server and configuration utilities"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "spelunk"
path = "src/main.rs"

[dependencies]
spelunk-config.workspace = true
spelunk-mcp.workspace = true
spelunk-store.workspace = true
anyhow.workspace = true
clap = { version = "4", features = ["derive", "env"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true

[dev-dependencies]
rusqlite = { version = "0.41", features = ["bundled"] }
serde_json = "1"
