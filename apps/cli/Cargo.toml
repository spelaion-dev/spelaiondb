[package]
name = "spelaion-cli"
description = "SpelaionDB CLI: MCP server and configuration utilities"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "spelaiondb"
path = "src/main.rs"

[dependencies]
spelaion-config.workspace = true
spelaion-core.workspace = true
spelaion-mcp.workspace = true
spelaion-store.workspace = true
anyhow.workspace = true
clap = { version = "4", features = ["derive", "env"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true

[dev-dependencies]
futures-util.workspace = true
rusqlite = { version = "0.41", features = ["bundled"] }
serde_json = "1"
spelaion-driver-api.workspace = true
