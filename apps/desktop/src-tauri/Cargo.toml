[package]
name = "spelunk-desktop"
description = "SpelunkDB desktop app (Tauri 2)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# The _lib suffix avoids a name clash between lib and bin on Windows.
name = "spelunk_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
# On Windows the test executable of a Tauri crate does not start (it lacks the app
# manifest). The app is tested with the smoke test (e2e/smoke.mjs) and its logic lives in crates/.
test = false
doctest = false

[[bin]]
name = "spelunk-desktop"
path = "src/main.rs"
test = false

[[bin]]
name = "export-bindings"
path = "src/bin/export-bindings.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
spelunk-config.workspace = true
spelunk-core.workspace = true
spelunk-driver-api.workspace = true
spelunk-ssh.workspace = true
arrow.workspace = true
async-trait.workspace = true
futures-util.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# TS types generated from Rust (CLAUDE.md). Still a release candidate: exact version.
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "0.0"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
tokio = { workspace = true, features = ["sync", "time"] }

[lints]
workspace = true
