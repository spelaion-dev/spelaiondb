; PgBouncer in transaction mode in front of the test PostgreSQL (SDB-396). It is configured to
; be as hard on a client as a pooler can be, so the tests catch a driver that relies on its
; session: no protocol-level prepared statements (the default since PgBouncer 1.24 keeps
; them for the client; older poolers and many hosted ones do not), and each transaction handed
; to the server connection used least recently, so two transactions of one client run on two
; server connections whenever two are free.

[databases]
spelaion = host=postgres port=5432 dbname=spelaion

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_prepared_statements = 0
server_round_robin = 1
default_pool_size = 4
min_pool_size = 2
max_client_conn = 50
ignore_startup_parameters = extra_float_digits
