# Servers that speak PostgreSQL's protocol (SDB-169), for `crates/spelaion-core/tests/postgres_family.rs`.
# A project of its own, apart from the main test environment: the images are large (RisingWave's
# is about 11 GB), so nothing starts them unless asked, and CI does not.
#
#   docker compose -f testing/docker/pg-family/compose.yaml up -d --wait
#
# Then, with the plugin variables of `spelaion-plugin-fetch`:
#   SPELAION_TEST_COCKROACH=127.0.0.1:26257 SPELAION_TEST_YUGABYTE=127.0.0.1:15433
#   SPELAION_TEST_TIMESCALE=127.0.0.1:15435 SPELAION_TEST_RISINGWAVE=127.0.0.1:14566
#   SPELAION_TEST_MATERIALIZE=127.0.0.1:16875 SPELAION_TEST_CRATEDB=127.0.0.1:15436
#   cargo test -p spelaion-core --test postgres_family
#
# Every server logs in without a password, as its image starts.
name: spelaion-test-pg-family

services:
  cockroachdb:
    image: cockroachdb/cockroach:v24.3.37
    command: ["start-single-node", "--insecure"]
    ports:
      - "127.0.0.1:26257:26257"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/health?ready=1"]
      interval: 2s
      retries: 60

  # 2026.1.3.0; the image has no tag for its build number, so it is pinned by digest.
  yugabytedb:
    image: yugabytedb/yugabyte@sha256:c1ddbf9c189f6ef33f03c648efadb1b1e82b5e7c8be472c56b1357c024221528
    command: ["bin/yugabyted", "start", "--background=false"]
    ports:
      - "127.0.0.1:15433:5433"
    healthcheck:
      test: ["CMD-SHELL", "bin/ysqlsh -h $$(hostname) -c 'select 1'"]
      interval: 3s
      retries: 60

  # PostgreSQL with the TimescaleDB extension: the server says it is PostgreSQL.
  timescaledb:
    image: timescale/timescaledb:2.32.0-pg17
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:15435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30

  risingwave:
    image: risingwavelabs/risingwave:v3.1.1
    command: ["single_node"]
    ports:
      - "127.0.0.1:14566:4566"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/4566'"]
      interval: 3s
      retries: 60

  materialize:
    image: materialize/materialized:v26.50.1
    ports:
      - "127.0.0.1:16875:6875"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:6878/api/readyz"]
      interval: 3s
      retries: 60

  cratedb:
    image: crate:6.5.1
    command: ["-Cdiscovery.type=single-node"]
    ports:
      - "127.0.0.1:15436:5432"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:4200"]
      interval: 3s
      retries: 60
