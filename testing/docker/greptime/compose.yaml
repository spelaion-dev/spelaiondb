# Barrier regression fixture only: this does not announce GreptimeDB support (SDB-343).
name: spelaion-test-greptime
services:
  greptime:
    image: greptime/greptimedb:v1.3.1
    command:
      - standalone
      - start
      - --mysql-addr
      - 0.0.0.0:4002
      - --postgres-addr
      - 0.0.0.0:4003
    ports:
      - "127.0.0.1:18402:4002"
      - "127.0.0.1:18403:4003"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:4000/health"]
      interval: 2s
      retries: 30
