# SpelaionDB test environment: databases behind two SSH hops.
#
#   host ──2221──► bastion1 ──(mid network)──► bastion2 ──(data network)──► postgres:5432
#                                                                          mysql:3306
#                                                                          mariadb:3306
#                                                                          sqlserver:1433
#                                                                          clickhouse:8123
#                                                                          trino:8080, presto:8080
#                                                                          oracle:1521
#                                                                          oracle-tls:2484
#                                                                          libsql:8080
#                                                                          gizmosql:31337
#                                                                          neo4j:7474
#                                                                          databend:8000
#                                                                          spanner:9020
#                                                                          hive:10000
#
#   host ──2221──► bastion1 ──(mid network)──► sqlitehost (sqlite3 runs there)
#
# Each hop only sees the next one: "bastion2" and "postgres" do not resolve from the host.
# Postgres is also published on 127.0.0.1:15432, MySQL on 13306, MariaDB on 13307, SQL
# Server on 11433, ClickHouse on 18123, Trino on 18080, Presto on 18081, Oracle on 11521
# (TCPS on 12484), libSQL on 18095, GizmoSQL on 31337, Neo4j on 17474, Hive on 11010, Databend
# on 18320 and Spanner's emulator on 19021, for tests without SSH. The proxies are on 11080 (SOCKS5) and 13128 (HTTP).
# MongoDB, whose language is not SQL (ADR-056), is on 27017.
name: spelaion-test

services:
  bastion1:
    build: ./bastion
    ports:
      - "127.0.0.1:2221:22"
    volumes:
      - ./keys/authorized_keys:/etc/ssh/authorized_keys/spelaion:ro
    networks: [public, mid]

  bastion2:
    build: ./bastion
    volumes:
      - ./keys/authorized_keys:/etc/ssh/authorized_keys/spelaion:ro
    networks: [mid, data]

  # PostgreSQL 17 with PostGIS available (the map view's tests, ADR-045). The image's own
  # init script is hidden by the mount below: only `spelaion_gis` has the extension, so the
  # `spelaion` database's catalog is the same as on plain PostgreSQL.
  postgres:
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_USER: spelaion
      POSTGRES_PASSWORD: spelaion
      POSTGRES_DB: spelaion
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
      - ./keys/server.crt:/certs/server.crt:ro
      - ./keys/server.key:/certs/server.key:ro
      - ./keys/ca.crt:/certs/ca.crt:ro
      - ./postgres/pg_hba.conf:/certs/pg_hba.conf:ro
    # TLS enabled (without requiring it): PostgreSQL rejects keys mounted from Windows because
    # of their permissions, so they are copied inside with the owner and permissions it wants.
    # The user "spelaion_cert" logs in only with a client certificate from the test authority
    # (ADR-022; see postgres/pg_hba.conf).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        install -o postgres -g postgres -m 600 /certs/server.key /var/lib/postgresql/server.key
        install -o postgres -g postgres -m 644 /certs/server.crt /var/lib/postgresql/server.crt
        install -o postgres -g postgres -m 644 /certs/ca.crt /var/lib/postgresql/ca.crt
        install -o postgres -g postgres -m 644 /certs/pg_hba.conf /var/lib/postgresql/pg_hba.conf
        exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/var/lib/postgresql/server.crt -c ssl_key_file=/var/lib/postgresql/server.key -c ssl_ca_file=/var/lib/postgresql/ca.crt -c hba_file=/var/lib/postgresql/pg_hba.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spelaion -d spelaion"]
      interval: 2s
      retries: 30
    # "direct" only exists to publish the port: Docker does not publish ports of containers
    # that are only on internal networks. No bastion is on it.
    networks: [data, direct]

  # MySQL 8.4 LTS and MariaDB 11.4 LTS with TLS (not required). Like PostgreSQL, the key is
  # copied inside with the owner and permissions the server accepts.
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: spelaion-root
      MYSQL_DATABASE: spelaion
      MYSQL_USER: spelaion
      MYSQL_PASSWORD: spelaion
    ports:
      - "127.0.0.1:13306:3306"
    volumes:
      - ./keys/ca.crt:/certs/ca.crt:ro
      - ./keys/mysql.crt:/certs/mysql.crt:ro
      - ./keys/mysql.key:/certs/mysql.key:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /etc/mysql-tls
        install -o mysql -g mysql -m 600 /certs/mysql.key /etc/mysql-tls/server.key
        install -o mysql -g mysql -m 644 /certs/mysql.crt /etc/mysql-tls/server.crt
        install -o mysql -g mysql -m 644 /certs/ca.crt /etc/mysql-tls/ca.crt
        exec docker-entrypoint.sh mysqld --ssl-ca=/etc/mysql-tls/ca.crt --ssl-cert=/etc/mysql-tls/server.crt --ssl-key=/etc/mysql-tls/server.key --log-bin-trust-function-creators=1
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uspelaion -pspelaion --silent"]
      interval: 2s
      retries: 60
    networks: [data, direct]

  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: spelaion-root
      MARIADB_DATABASE: spelaion
      MARIADB_USER: spelaion
      MARIADB_PASSWORD: spelaion
    ports:
      - "127.0.0.1:13307:3306"
    volumes:
      - ./keys/ca.crt:/certs/ca.crt:ro
      - ./keys/mysql.crt:/certs/mysql.crt:ro
      - ./keys/mysql.key:/certs/mysql.key:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /etc/mysql-tls
        install -o mysql -g mysql -m 600 /certs/mysql.key /etc/mysql-tls/server.key
        install -o mysql -g mysql -m 644 /certs/mysql.crt /etc/mysql-tls/server.crt
        install -o mysql -g mysql -m 644 /certs/ca.crt /etc/mysql-tls/ca.crt
        exec docker-entrypoint.sh mariadbd --ssl-ca=/etc/mysql-tls/ca.crt --ssl-cert=/etc/mysql-tls/server.crt --ssl-key=/etc/mysql-tls/server.key
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      retries: 60
    networks: [data, direct]

  # A server holding a SQLite file (ADR-018): it lets the client run commands and has
  # sqlite3, unlike the bastions. Only bastion1 reaches it: tests go through two hops.
  sqlitehost:
    build: ./sqlitehost
    volumes:
      - ./keys/authorized_keys:/etc/ssh/authorized_keys/spelaion:ro
    networks: [mid]

  # SOCKS5 and HTTP proxies with a password (ADR-027). They see the bastions and the
  # databases, which the host does not: a tunnel can reach them through the proxy alone or
  # run its first SSH hop through it.
  proxy:
    build: ./proxy
    ports:
      - "127.0.0.1:11080:1080"
      - "127.0.0.1:13128:3128"
    networks: [public, mid, data]

  # SQL Server 2022 (Developer edition, free for development and testing). It encrypts with a
  # self-signed certificate of its own. Tests log in as `sa` and create the `spelaion` database.
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: Spelaion-test-1
    ports:
      - "127.0.0.1:11433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"select 1\" -b -o /dev/null"]
      interval: 3s
      retries: 60
      start_period: 10s
    networks: [data, direct]

  # MongoDB 8.0, reached through its plugin (SpelaionDB's ADR-056). The user `spelaion`
  # (password `spelaion`) is in `admin`. 127.0.0.1:27017 (SPELAION_TEST_MONGO).
  mongodb:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: spelaion
      MONGO_INITDB_ROOT_PASSWORD: spelaion
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      retries: 60
      start_period: 5s
    networks: [data, direct]

  # ClickHouse 25.8 (an LTS release), the first engine that is only a plugin (ADR-041). Its
  # HTTP interface is published on 127.0.0.1:18123; through the tunnels it is clickhouse:8123.
  # TLS is tested in its plugin's repository. User, password and database: `spelaion`.
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_USER: spelaion
      CLICKHOUSE_PASSWORD: spelaion
      CLICKHOUSE_DB: spelaion
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:18123:8123"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping || exit 1"]
      interval: 2s
      retries: 60
    networks: [data, direct]

  redis:
    image: redis:7.4
    command: ["redis-server", "--requirepass", "spelaion"]
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "spelaion", "--no-auth-warning", "ping"]
      interval: 2s
      retries: 60
    networks: [data, direct]

  # Trino 479 and Presto 0.295, one plugin for both, with the catalogs their images ship
  # (`memory`, `tpch`…). Published on 127.0.0.1:18080 and 18081; through the tunnels they are
  # trino:8080 and presto:8080. No password: they take one only over TLS.
  trino:
    image: trinodb/trino:479
    ports:
      - "127.0.0.1:18080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/v1/info | grep -q '\"starting\":false'"]
      interval: 3s
      retries: 80
    networks: [data, direct]

  # GizmoSQL 1.42.3 (DuckDB behind Arrow Flight SQL), served by the Flight SQL plugin as
  # `gizmosql` and as the generic `flightsql`. 127.0.0.1:31337; through the tunnels
  # gizmosql:31337. User `spelaion`, password `spelaion`. Dremio is tested in the plugin's own
  # repository.
  gizmosql:
    image: gizmodata/gizmosql@sha256:88e9d292d6cfe2f41e28d3baab24230691bf07af671b2329d226689fe5634150
    environment:
      GIZMOSQL_USERNAME: spelaion
      GIZMOSQL_PASSWORD: spelaion
      TLS_ENABLED: "0"
    ports:
      - "127.0.0.1:31337:31337"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/31337' || exit 1"]
      interval: 2s
      retries: 60
    networks: [data, direct]

  # Apache Hive 4.0.1's HiveServer2 with its embedded metastore, served by the HiveServer2
  # plugin as `hive`. 127.0.0.1:11010; through the tunnels hive:10000. No authentication (any
  # user and password). Spark's Thrift server, Kyuubi and Impala are tested in the plugin's own
  # repository. Its JVM is bounded: CI's runner is tight (SDB-345).
  hive:
    image: apache/hive@sha256:5194161ef50b80875f937dff04936df047cbe894e9727ab8f0606349345b1bd3
    environment:
      SERVICE_NAME: hiveserver2
      SERVICE_OPTS: -Xmx768m
    mem_limit: 1536m
    ports:
      - "127.0.0.1:11010:10000"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/10000' || exit 1"]
      interval: 3s
      retries: 100
    networks: [data, direct]

  presto:
    image: prestodb/presto:0.295
    ports:
      - "127.0.0.1:18081:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/v1/info | grep -q '\"starting\":false'"]
      interval: 3s
      retries: 80
    networks: [data, direct]

  # Oracle Database Free (the lite image), served only by its plugin (ADR-059). Its listener is
  # published on 127.0.0.1:11521; through the tunnels it is oracle:1521. User and password
  # `spelaion`, service FREEPDB1 (`oracle/startup` makes the user on every start).
  oracle:
    image: container-registry.oracle.com/database/free:latest-lite
    environment:
      ORACLE_PWD: spelaion-test-Pw1
    ports:
      - "127.0.0.1:11521:1521"
    volumes:
      - ./oracle/startup:/opt/oracle/scripts/startup:ro
    healthcheck:
      test: ["CMD", "/opt/oracle/checkDBStatus.sh"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 60s
    networks: [data, direct]

  # Oracle's TCPS: the lite image has no `orapki` to set TLS up in the database, so a TLS proxy
  # in front of its listener carries the TCPS session (certificate `keys/oracle.pem`, for
  # "localhost" and "oracle-tls"). Published on 127.0.0.1:12484; through the tunnels it is
  # oracle-tls:2484.
  oracle-tls:
    image: haproxy:3.2-alpine
    depends_on:
      oracle:
        condition: service_healthy
    ports:
      - "127.0.0.1:12484:2484"
    volumes:
      - ./oracle/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./keys/oracle.pem:/usr/local/etc/haproxy/server.pem:ro
    networks: [data, direct]

  # libSQL's server (sqld 0.24.33), served only by its plugin (ADR-058): Hrana over HTTP,
  # published on 127.0.0.1:18095 without authentication; through the tunnels and the proxies it
  # is libsql:8080. Tokens and TLS are tested in its plugin's repository.
  libsql:
    image: ghcr.io/tursodatabase/libsql-server:v0.24.33
    ports:
      - "127.0.0.1:18095:8080"
    networks: [data, direct]

  # Cassandra 5 (ADR-056), through its plugin, on 127.0.0.1:19142 with no login. CI's runner
  # holds every engine at once: a small heap, what the JVM may take off the heap bounded too
  # (by default it may reserve gigabytes of direct memory, touches the whole heap at start and
  # runs a GC thread per CPU), and a hard cap, so this container can never push another out.
  cassandra:
    image: cassandra:5
    mem_limit: 1g
    environment:
      MAX_HEAP_SIZE: 256M
      HEAP_NEWSIZE: 64M
      JVM_EXTRA_OPTS: >-
        -XX:MaxDirectMemorySize=128M -XX:-AlwaysPreTouch -XX:ParallelGCThreads=2
        -XX:ConcGCThreads=1 -XX:CICompilerCount=2
    ports:
      - "127.0.0.1:19142:9042"
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "DESCRIBE KEYSPACES"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 30s

  # Neo4j 5.26 (community), served only by its plugin over its HTTP Query API (ADR-056),
  # published on 127.0.0.1:17474 (user neo4j, password spelaion-test); through the tunnels and
  # the proxies it is neo4j:7474. TLS is tested in its plugin's repository.
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/spelaion-test
      # Bounded for CI's runners (SDB-345): a 512 MB heap, a 128 MB page cache, 1 GB in all.
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 128m
    mem_limit: 1g
    ports:
      - "127.0.0.1:17474:7474"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7474 >/dev/null || exit 1"]
      interval: 3s
      retries: 60
    networks: [data, direct]

  # TDengine 3.3.6 (ADR-056), through its plugin over taosAdapter's REST API, on 127.0.0.1:16141
  # with the image's own login (`root`, `taosdata`). Its memory is capped: CI's runner holds every
  # engine at once (SDB-345).
  tdengine:
    image: tdengine/tdengine:3.3.6.13
    mem_limit: 1g
    ports:
      - "127.0.0.1:16141:6041"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u root:taosdata -d 'select server_version()' http://127.0.0.1:6041/rest/sql"]
      interval: 3s
      timeout: 5s
      retries: 60
    networks: [data, direct]

  # Databend 1.2.881, served only by its plugin over its HTTP query API (SDB-351), published on
  # 127.0.0.1:18320 (user spelaion, password spelaion-test, which replaces the image's root);
  # through the tunnels and the proxies it is databend:8000. TLS is tested in its plugin's
  # repository. Bounded for CI's runners (SDB-345): 1 GB.
  databend:
    image: datafuselabs/databend:v1.2.881
    mem_limit: 1g
    environment:
      QUERY_DEFAULT_USER: spelaion
      QUERY_DEFAULT_PASSWORD: spelaion-test
    ports:
      - "127.0.0.1:18320:8000"
    # No client in the image: the port answering is enough.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000"]
      interval: 2s
      retries: 60
    networks: [data, direct]

  # Google's Spanner emulator 1.5.28, served only by its plugin over its REST API (SDB-352),
  # published on 127.0.0.1:19021 (no login); through the tunnels and the proxies it is
  # spanner:9020. Its image has no shell for a healthcheck: tests/spanner.rs creates the
  # instance and the database it needs. TLS is tested in its plugin's repository. Bounded for
  # CI's runners (SDB-345): 1 GB.
  spanner:
    image: gcr.io/cloud-spanner-emulator/emulator:1.5.28
    mem_limit: 1g
    ports:
      - "127.0.0.1:19021:9020"
    networks: [data, direct]

networks:
  public: {}
  direct: {}
  mid:
    internal: true
  data:
    internal: true
