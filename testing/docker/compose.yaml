# SpelunkDB test environment: databases behind two SSH hops.
#
#   host ──2221──► bastion1 ──(mid network)──► bastion2 ──(data network)──► postgres:5432
#                                                                          mysql:3306
#                                                                          mariadb:3306
#                                                                          sqlserver:1433
#
# Each hop only sees the next one: "bastion2" and "postgres" do not resolve from the host.
# Postgres is also published on 127.0.0.1:15432, MySQL on 13306, MariaDB on 13307 and SQL
# Server on 11433, for tests without SSH.
name: spelunk-test

services:
  bastion1:
    build: ./bastion
    ports:
      - "127.0.0.1:2221:22"
    volumes:
      - ./keys/authorized_keys:/etc/ssh/authorized_keys/spelunk:ro
    networks: [public, mid]

  bastion2:
    build: ./bastion
    volumes:
      - ./keys/authorized_keys:/etc/ssh/authorized_keys/spelunk:ro
    networks: [mid, data]

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: spelunk
      POSTGRES_PASSWORD: spelunk
      POSTGRES_DB: spelunk
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
      - ./keys/server.crt:/certs/server.crt:ro
      - ./keys/server.key:/certs/server.key:ro
    # TLS enabled (without requiring it): PostgreSQL rejects keys mounted from Windows because
    # of their permissions, so they are copied inside with the owner and permissions it wants.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        install -o postgres -g postgres -m 600 /certs/server.key /var/lib/postgresql/server.key
        install -o postgres -g postgres -m 644 /certs/server.crt /var/lib/postgresql/server.crt
        exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/var/lib/postgresql/server.crt -c ssl_key_file=/var/lib/postgresql/server.key
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spelunk -d spelunk"]
      interval: 2s
      retries: 30
    # "direct" only exists to publish the port: Docker does not publish ports of containers
    # that are only on internal networks. No bastion is on it.
    networks: [data, direct]

  # MySQL 8.4 LTS and MariaDB 11.4 LTS with TLS (not required). Like PostgreSQL, the key is
  # copied inside with the owner and permissions the server accepts.
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: spelunk-root
      MYSQL_DATABASE: spelunk
      MYSQL_USER: spelunk
      MYSQL_PASSWORD: spelunk
    ports:
      - "127.0.0.1:13306:3306"
    volumes:
      - ./keys/ca.crt:/certs/ca.crt:ro
      - ./keys/mysql.crt:/certs/mysql.crt:ro
      - ./keys/mysql.key:/certs/mysql.key:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /etc/mysql-tls
        install -o mysql -g mysql -m 600 /certs/mysql.key /etc/mysql-tls/server.key
        install -o mysql -g mysql -m 644 /certs/mysql.crt /etc/mysql-tls/server.crt
        install -o mysql -g mysql -m 644 /certs/ca.crt /etc/mysql-tls/ca.crt
        exec docker-entrypoint.sh mysqld --ssl-ca=/etc/mysql-tls/ca.crt --ssl-cert=/etc/mysql-tls/server.crt --ssl-key=/etc/mysql-tls/server.key
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uspelunk -pspelunk --silent"]
      interval: 2s
      retries: 60
    networks: [data, direct]

  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: spelunk-root
      MARIADB_DATABASE: spelunk
      MARIADB_USER: spelunk
      MARIADB_PASSWORD: spelunk
    ports:
      - "127.0.0.1:13307:3306"
    volumes:
      - ./keys/ca.crt:/certs/ca.crt:ro
      - ./keys/mysql.crt:/certs/mysql.crt:ro
      - ./keys/mysql.key:/certs/mysql.key:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /etc/mysql-tls
        install -o mysql -g mysql -m 600 /certs/mysql.key /etc/mysql-tls/server.key
        install -o mysql -g mysql -m 644 /certs/mysql.crt /etc/mysql-tls/server.crt
        install -o mysql -g mysql -m 644 /certs/ca.crt /etc/mysql-tls/ca.crt
        exec docker-entrypoint.sh mariadbd --ssl-ca=/etc/mysql-tls/ca.crt --ssl-cert=/etc/mysql-tls/server.crt --ssl-key=/etc/mysql-tls/server.key
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      retries: 60
    networks: [data, direct]

  # SQL Server 2022 (Developer edition, free for development and testing). It encrypts with a
  # self-signed certificate of its own. Tests log in as `sa` and create the `spelunk` database.
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: Spelunk-test-1
    ports:
      - "127.0.0.1:11433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"select 1\" -b -o /dev/null"]
      interval: 3s
      retries: 60
      start_period: 10s
    networks: [data, direct]

networks:
  public: {}
  direct: {}
  mid:
    internal: true
  data:
    internal: true
