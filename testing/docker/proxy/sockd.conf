logoutput: stderr
internal: 0.0.0.0 port = 1080
# The container is on three networks: leave through whichever routes to the target.
external: eth0
external: eth1
external: eth2
external.rotation: route
socksmethod: username
user.privileged: root
user.unprivileged: nobody

client pass {
  from: 0.0.0.0/0 to: 0.0.0.0/0
}

socks pass {
  from: 0.0.0.0/0 to: 0.0.0.0/0
  command: connect
}
