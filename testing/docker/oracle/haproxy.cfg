# TCPS in front of the test database: TLS on 2484, the plain TNS session to the database's
# listener behind it.
global
  log stdout format raw local0
  # Neither CPU count nor the host's high file-descriptor limit should size CI's pools.
  nbthread 2
  maxconn 128

defaults
  mode tcp
  timeout connect 10s
  timeout client 1h
  timeout server 1h

frontend tcps
  bind :2484 ssl crt /usr/local/etc/haproxy/server.pem
  default_backend oracle

backend oracle
  server oracle oracle:1521
