[package]
name = "grid-stream"
version = "0.0.0"
description = "Phase 0, experiments 1 and 3: canvas grid with 1 M rows and PG -> Arrow -> UI streaming"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# The _lib suffix avoids a name clash between lib and bin on Windows.
name = "grid_stream_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
arrow = { version = "60", default-features = false, features = ["ipc"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.40"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-postgres = "0.7"
