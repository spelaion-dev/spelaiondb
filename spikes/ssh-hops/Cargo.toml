[package]
name = "ssh-hops"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Phase 0, experiment 2: PostgreSQL through N SSH hops with russh"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
# ring instead of aws-lc-rs (the default), which needs CMake and NASM on Windows.
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
tokio = { version = "1", features = ["full"] }
tokio-postgres = "0.7"
