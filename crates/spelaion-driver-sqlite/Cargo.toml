[package]
name = "spelaion-driver-sqlite"
description = "SQLite driver for SpelaionDB"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
spelaion-driver-api.workspace = true
spelaion-dialect.workspace = true
spelaion-plugin-sdk.workspace = true
arrow.workspace = true
async-trait.workspace = true
futures-util.workspace = true
# bundled: SQLite compiled in, same version on all three platforms.
rusqlite = { version = "0.41", features = ["bundled", "column_decltype", "column_metadata"] }
# io-util: talking to sqlite3 on a server (remote.rs).
tokio = { workspace = true, features = ["io-util"] }

[dev-dependencies]
insta.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
