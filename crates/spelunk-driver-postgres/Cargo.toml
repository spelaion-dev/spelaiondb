[package]
name = "spelunk-driver-postgres"
description = "PostgreSQL driver for SpelunkDB"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
spelunk-driver-api.workspace = true
arrow.workspace = true
async-stream = "0.3"
async-trait.workspace = true
fallible-iterator = "0.2"
futures-util.workspace = true
postgres-protocol.workspace = true
# ring instead of aws-lc-rs: the latter needs CMake and NASM on Windows.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
tokio.workspace = true
tokio-postgres.workspace = true
tokio-postgres-rustls = { version = "0.14", features = ["ring"] }

[dev-dependencies]
insta.workspace = true
tokio-postgres.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
