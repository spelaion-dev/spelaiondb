[package]
name = "spelaion-driver-duckdb"
description = "DuckDB driver for SpelaionDB"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
spelaion-driver-api.workspace = true
arrow.workspace = true
async-trait.workspace = true
# bundled: DuckDB compiled in, same version on all three platforms. Its Arrow is ours (60).
# No default features: they only add libduckdb-sys's download-lib (ureq + rustls), pkg-config
# and vcpkg, which find or fetch a prebuilt library and are never used by a bundled build.
duckdb = { version = "=1.20000.1", default-features = false, features = ["bundled"] }
futures-util.workspace = true
tokio.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
