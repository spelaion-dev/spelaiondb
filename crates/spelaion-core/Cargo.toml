[package]
name = "spelaion-core"
description = "SpelaionDB core: sessions, execution and results (ADR-002)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Remote programs for drivers (open.rs, ADR-018).
async-trait.workspace = true
spelaion-config.workspace = true
spelaion-driver-api.workspace = true
spelaion-dialect.workspace = true
spelaion-plugin-host.workspace = true
spelaion-driver-sqlite.workspace = true
spelaion-ssh.workspace = true
spelaion-store.workspace = true
arrow.workspace = true
async-stream = "0.3"
futures-util.workspace = true
sqlparser = { version = "0.63", features = ["visitor"] }
thiserror.workspace = true
# Port lists from `kubectl get … -o json` (kube.rs), and JSON imports (import/source.rs).
serde_json = "1"
quick-xml = "0.42"
# Images of the cell viewer as `data:` URLs (value_view.rs).
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
# Dates and timestamps of imports, in the formats the user chooses (ADR-038), and "now" for a
# bulk edit (pending.rs).
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# New UUIDs for a bulk edit of a selection (pending.rs, ADR-044).
uuid = { version = "1", features = ["v4"] }
specta = { version = "=2.0.0-rc.26", features = ["derive"], optional = true }
# Content hashes of `.sql` files, to notice a change on disk (sql_file.rs, ADR-036).
sha2 = "0.10"
# plugins.toml, compiled in, is read when the engines are set up (plugins/pins.rs).
toml = "1"
# process + io-util: `kubectl port-forward` for Kubernetes tunnels (kube.rs) and the native
# backup tools (backup/, ADR-049), whose files are written with fs.
tokio = { workspace = true, features = ["sync", "time", "process", "io-util", "net", "macros", "fs"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }

[lints]
workspace = true

[features]
# Type descriptions for the desktop's generated bindings; no shell dependency.
bindings = ["dep:specta"]
