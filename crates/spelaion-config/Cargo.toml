[package]
name = "spelaion-config"
description = "Version-controlled SpelaionDB configuration: connections, tunnels, variables and secrets (ADR-009)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
# The integration tests are one binary (tests/main.rs, SDB-168).
autotests = false

# Every file of tests/ in one binary, linked once; its files still run one after another
# (tests/serial.rs). `cargo test -p spelaion-config <file name>` runs one file.
[[test]]
name = "config"
path = "tests/main.rs"

[dependencies]
# DBeaver obscures its saved credentials with AES-128-CBC (dbeaver.rs); TablePlus encrypts
# its exports in RNCryptor's format: PBKDF2-SHA1, AES-256-CBC, HMAC-SHA256 (tableplus.rs).
# All already in the tree.
aes = "0.8"
# The encrypted connections file (ADR-088, connections_file.rs): Argon2id and AES-256-GCM from
# RustCrypto, the versions russh already brings through ssh-key and ssh-cipher, so no crate is
# added to the build; the salt and nonce from the system's random source, as uuid already does;
# keys and plaintexts wiped when dropped.
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc", "zeroize"] }
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
getrandom = "0.4"
zeroize = "1"
cbc = "0.1"
hmac = "0.13"
pbkdf2 = "0.13"
sha1 = "0.11"
sha2 = "0.11"
spelaion-driver-api.workspace = true
keyring-core = "1"
# DataGrip writes its data sources as XML (datagrip.rs); already in the tree through Tauri.
quick-xml = "0.42"
# TablePlus keeps its connections in a property list (tableplus.rs); already in the tree
# through Tauri.
plist = "1"
# pgAdmin keeps its servers in a SQLite database (pgadmin4.db, pgadmin.rs), opened read-only;
# already in the tree (spelaion-store, the SQLite driver).
rusqlite = { version = "0.41", features = ["bundled"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
toml = "1"
toml_edit = "0.25"
url = "2"

# System keychain: one store per platform, as keyring-rs recommends for applications.
# On Linux, Secret Service through libdbus (the zbus variant pulls in unmaintained
# crates: RUSTSEC-2026-0370/0371/0372).
[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "1", default-features = false }
windows-registry = "0.6.1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# crypto-rust: the secret travels encrypted over D-Bus without depending on OpenSSL.
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
