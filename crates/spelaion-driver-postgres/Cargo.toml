[package]
name = "spelaion-driver-postgres"
description = "PostgreSQL driver for SpelaionDB"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
spelaion-driver-api.workspace = true
spelaion-dialect.workspace = true
arrow.workspace = true
async-stream = "0.3"
async-trait.workspace = true
# COPY data for imports (ADR-038).
bytes = "1"
fallible-iterator = "0.2"
futures-util.workspace = true
postgres-protocol.workspace = true
# ring instead of aws-lc-rs: the latter needs CMake and NASM on Windows.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
# `net` and `io-util`: the cancel request opens its own socket and waits for its close.
tokio = { workspace = true, features = ["net", "io-util"] }
tokio-postgres.workspace = true
tokio-postgres-rustls = { version = "0.14", features = ["ring"] }

[dev-dependencies]
insta.workspace = true
tokio-postgres.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
