[package]
name = "spelaion-plugin-protocol"
description = "The protocol between SpelaionDB's core and an engine plugin: frames and messages (ADR-041)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
spelaion-driver-api.workspace = true
arrow.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
# Frames are read from and written to a child program's pipes.
tokio = { workspace = true, features = ["io-util"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "io-util"] }

[lints]
workspace = true
