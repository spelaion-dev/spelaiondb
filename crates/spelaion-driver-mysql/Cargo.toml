[package]
name = "spelaion-driver-mysql"
description = "MySQL and MariaDB driver for SpelaionDB"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
spelaion-driver-api.workspace = true
spelaion-dialect.workspace = true
spelaion-plugin-sdk.workspace = true
arrow.workspace = true
async-trait.workspace = true
futures-util.workspace = true
# rustls with ring: aws-lc-rs (the default provider) needs CMake and NASM on Windows.
mysql_async = { version = "0.37", default-features = false, features = ["minimal-rust", "rustls-tls", "ring"] }
# Only to install ring as the process's rustls provider: with SQL Server's tiberius in the
# build, rustls also has aws-lc-rs and no longer picks one by itself.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio.workspace = true

[dev-dependencies]
insta.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
