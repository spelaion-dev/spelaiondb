[package]
name = "spelaion-ssh"
description = "SpelaionDB SSH tunnels: chained hops, agents and known_hosts (ADR-007)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
spelaion-driver-api.workspace = true
async-trait.workspace = true
data-encoding = "2"
ring = "0.17"
# ring instead of aws-lc-rs (the default), which needs CMake and NASM on Windows.
russh = { version = "0.65", default-features = false, features = ["ring", "flate2", "rsa"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "process", "io-util", "time", "sync", "rt", "macros"] }

[dev-dependencies]
futures-util.workspace = true
spelaion-driver-postgres.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
