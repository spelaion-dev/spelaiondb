[package]
name = "spelunk-mcp"
description = "SpelunkDB MCP server: agents query, they do not write (ADR-008)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
spelunk-config.workspace = true
spelunk-core.workspace = true
spelunk-driver-api.workspace = true
spelunk-ssh.workspace = true
spelunk-store.workspace = true
rmcp = { version = "3", features = ["server", "transport-io", "macros"] }
serde = { version = "1", features = ["derive"] }
tokio = { workspace = true, features = ["sync", "time", "io-std"] }

[lints]
workspace = true
