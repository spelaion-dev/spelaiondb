[package]
name = "spelunk-core"
description = "SpelunkDB core: sessions, execution and results (ADR-002)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
spelunk-config.workspace = true
spelunk-driver-api.workspace = true
spelunk-driver-mysql.workspace = true
spelunk-driver-postgres.workspace = true
spelunk-driver-sqlite.workspace = true
spelunk-driver-duckdb.workspace = true
spelunk-driver-sqlserver.workspace = true
spelunk-ssh.workspace = true
spelunk-store.workspace = true
arrow.workspace = true
async-stream = "0.3"
futures-util.workspace = true
sqlparser = { version = "0.63", features = ["visitor"] }
thiserror.workspace = true
# Port lists from `kubectl get … -o json` (kube.rs).
serde_json = "1"
# process + io-util: `kubectl port-forward` for Kubernetes tunnels (kube.rs).
tokio = { workspace = true, features = ["sync", "time", "process", "io-util"] }

[dev-dependencies]
async-trait.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
