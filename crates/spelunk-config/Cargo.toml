[package]
name = "spelunk-config"
description = "Version-controlled SpelunkDB configuration: connections, tunnels, variables and secrets (ADR-009)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
spelunk-driver-api.workspace = true
keyring-core = "1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
toml = "1"
toml_edit = "0.25"
url = "2"

# System keychain: one store per platform, as keyring-rs recommends for applications.
# On Linux, Secret Service through libdbus (the zbus variant pulls in unmaintained
# crates: RUSTSEC-2026-0370/0371/0372).
[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = { version = "1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# crypto-rust: the secret travels encrypted over D-Bus without depending on OpenSSL.
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[lints]
workspace = true
