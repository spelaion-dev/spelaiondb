[package]
name = "spelunk-driver-duckdb"
description = "DuckDB driver for SpelunkDB"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
spelunk-driver-api.workspace = true
arrow.workspace = true
async-trait.workspace = true
# bundled: DuckDB compiled in, same version on all three platforms. Its Arrow is ours (60).
duckdb = { version = "=1.20000.1", features = ["bundled"] }
futures-util.workspace = true
tokio.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
